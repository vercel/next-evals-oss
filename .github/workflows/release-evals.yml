name: Evaluate a Next.js release

on:
  workflow_call:
    inputs:
      releaseKind:
        description: Whether this package is a release, backport, or canary
        required: true
        type: string
      nextVersion:
        description: Exact published Next.js version (for example, 16.2.4 or 16.3.0-canary.12)
        required: true
        type: string
      nextRef:
        description: Matching Next.js release tag (for example, v16.2.4)
        required: true
        type: string
      nextSha:
        description: Full commit SHA used for the release
        required: true
        type: string
      sourceRunUrl:
        description: GitHub Actions URL for the Next.js release
        required: true
        type: string
      vercelOrgId:
        description: Canonical Vercel team ID used for GitHub OIDC authentication
        required: true
        type: string
      vercelProjectId:
        description: Vercel project ID that stores the release-eval credentials
        required: true
        type: string
      releaseAgentUrl:
        description: Production URL for the Eve release-evals agent
        required: true
        type: string
      releaseGitHubAppClientId:
        description: GitHub App client ID used to open measurement pull requests
        required: true
        type: string
    secrets:
      releaseGitHubAppPrivateKey:
        description: Private key for the measurement pull-request GitHub App
        required: true
concurrency:
  group: next-release-evals
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      next-version: ${{ steps.release.outputs.next-version }}
      release-kind: ${{ steps.release.outputs.release-kind }}
      next-ref: ${{ steps.release.outputs.next-ref }}
      next-sha: ${{ steps.release.outputs.next-sha }}
      source-run-url: ${{ steps.release.outputs.source-run-url }}
      evaluated-at: ${{ steps.release.outputs.evaluated-at }}
      suite-ref: ${{ steps.release.outputs.suite-ref }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check required credentials
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ inputs.vercelOrgId }}
          VERCEL_PROJECT_ID: ${{ inputs.vercelProjectId }}
          RELEASE_AGENT_URL: ${{ inputs.releaseAgentUrl }}
        run: |
          missing=()
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID RELEASE_AGENT_URL; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing release-eval credentials: ${missing[*]}" >&2
            exit 1
          fi

      - name: Validate dispatch payload
        id: release
        env:
          RELEASE_KIND: ${{ inputs.releaseKind }}
          NEXT_VERSION: ${{ inputs.nextVersion }}
          NEXT_REF: ${{ inputs.nextRef }}
          NEXT_SHA: ${{ inputs.nextSha }}
          SOURCE_RUN_URL: ${{ inputs.sourceRunUrl }}
        run: pnpm tsx scripts/release-automation.ts prepare

      - name: Verify the npm release exists
        env:
          NEXT_VERSION: ${{ steps.release.outputs.next-version }}
        run: |
          published="$(npm view "next@$NEXT_VERSION" version)"
          test "$published" = "$NEXT_VERSION"

      - name: Sync the fixed eval suite
        env:
          SUITE_REF: ${{ steps.release.outputs.suite-ref }}
        run: pnpm sync-evals "$SUITE_REF"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.0

      - name: Authenticate Vercel CLI access
        uses: vercel/authenticate-cli-action@cec4e78ed4686ab05721608393617a31147f082b
        with:
          team: ${{ inputs.vercelOrgId }}

      - name: Check the release project's credentials
        env:
          VERCEL_ORG_ID: ${{ inputs.vercelOrgId }}
          VERCEL_PROJECT_ID: ${{ inputs.vercelProjectId }}
          REQUIRE_CURSOR_API_KEY: "1"
        run: node scripts/ci-auth.mjs

      - name: Preflight the release matrix
        run: pnpm preflight

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-eval-suite
          path: evals
          if-no-files-found: error
          retention-days: 1

  evaluate:
    name: ${{ matrix.experiment }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-eval-suite
          path: ${{ runner.temp }}/release-eval-suite

      - name: Prepare an isolated release workspace
        env:
          RELEASE_EVAL_WORKSPACE: ${{ runner.temp }}/release-eval-workspace
          RELEASE_EVAL_SUITE_PATH: ${{ runner.temp }}/release-eval-suite
        run: pnpm tsx scripts/release-automation.ts prepare-workspace

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.0

      - name: Authenticate Vercel CLI access
        uses: vercel/authenticate-cli-action@cec4e78ed4686ab05721608393617a31147f082b
        with:
          team: ${{ inputs.vercelOrgId }}

      - name: Pull short-lived Vercel OIDC token
        env:
          VERCEL_ORG_ID: ${{ inputs.vercelOrgId }}
          VERCEL_PROJECT_ID: ${{ inputs.vercelProjectId }}
          REQUIRE_CURSOR_API_KEY: ${{ startsWith(matrix.experiment, 'cursor-') && '1' || '0' }}
        run: node scripts/ci-auth.mjs

      - name: Check the experiment can run
        env:
          EXPERIMENT: ${{ matrix.experiment }}
          NEXT_EVAL_VERSION: ${{ needs.prepare.outputs.next-version }}
          NEXT_RELEASE_EVAL_RUNS: "1"
          RELEASE_EVAL_WORKSPACE: ${{ runner.temp }}/release-eval-workspace
        run: |
          cd "$RELEASE_EVAL_WORKSPACE"
          node "$GITHUB_WORKSPACE/scripts/preflight.mjs" "$EXPERIMENT"

      - name: Run all evals against the release package
        id: run
        shell: bash
        env:
          EXPERIMENT: ${{ matrix.experiment }}
          NEXT_EVAL_VERSION: ${{ needs.prepare.outputs.next-version }}
          NEXT_RELEASE_EVAL_RUNS: "1"
          RELEASE_EVAL_WORKSPACE: ${{ runner.temp }}/release-eval-workspace
        run: |
          set +e
          cd "$RELEASE_EVAL_WORKSPACE"
          node "$GITHUB_WORKSPACE/node_modules/@vercel/agent-eval/dist/cli.js" run --force "$EXPERIMENT"
          initial_status=$?
          for retry in 1 2 3; do
            echo "Infrastructure recovery pass $retry/3"
            node "$GITHUB_WORKSPACE/node_modules/@vercel/agent-eval/dist/cli.js" run "$EXPERIMENT"
          done
          final_status=$?
          set -e
          echo "initial-exit-code=$initial_status" >> "$GITHUB_OUTPUT"
          echo "final-exit-code=$final_status" >> "$GITHUB_OUTPUT"
          echo "The runner exits nonzero for genuine model failures; the reporting gate validates the result files."

      - name: Confirm first-attempt model failures
        env:
          EXPERIMENT: ${{ matrix.experiment }}
          EVALUATED_AT: ${{ needs.prepare.outputs.evaluated-at }}
          NEXT_EVAL_VERSION: ${{ needs.prepare.outputs.next-version }}
          RELEASE_EVAL_WORKSPACE: ${{ runner.temp }}/release-eval-workspace
          DIAGNOSTIC_OUTPUT_DIR: ${{ runner.temp }}/release-diagnostic-summaries
          DIAGNOSTIC_RESULTS_DIR: ${{ runner.temp }}/release-diagnostic-runs
        run: pnpm tsx scripts/release-diagnostics.ts run

      - name: Validate and sanitize this experiment's new results
        shell: bash
        env:
          EXPERIMENT: ${{ matrix.experiment }}
          EVALUATED_AT: ${{ needs.prepare.outputs.evaluated-at }}
          RELEASE_EVAL_WORKSPACE: ${{ runner.temp }}/release-eval-workspace
        run: |
          experiment_results="$RELEASE_EVAL_WORKSPACE/results/$EXPERIMENT"
          if [[ ! -d "$experiment_results" ]]; then
            echo "The runner produced no new result files for $EXPERIMENT" >&2
            exit 1
          fi

          pnpm tsx scripts/release-automation.ts validate-results

          # The raw result tree contains transcripts, generated applications,
          # and command output. Only score summaries cross the job boundary.
          cd "$RELEASE_EVAL_WORKSPACE/results"
          find "$EXPERIMENT" -type f -name summary.json -print0 \
            | tar --null -czf "$RUNNER_TEMP/$EXPERIMENT.tar.gz" --files-from=-
          tar -tzf "$RUNNER_TEMP/$EXPERIMENT.tar.gz" | head -1

          node scripts/assert-no-secrets.mjs \
            "$RUNNER_TEMP/$EXPERIMENT.tar.gz" \
            "$RUNNER_TEMP/release-diagnostic-summaries/$EXPERIMENT.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-score-summary-${{ matrix.experiment }}
          path: ${{ runner.temp }}/${{ matrix.experiment }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostic-summary-${{ matrix.experiment }}
          path: ${{ runner.temp }}/release-diagnostic-summaries/${{ matrix.experiment }}.json
          if-no-files-found: error
          retention-days: 1

  report:
    name: Report release measurement
    needs: [prepare, evaluate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-eval-suite
          path: ${{ runner.temp }}/release-eval-suite

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-score-summary-*
          path: ${{ runner.temp }}/release-score-summaries
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-diagnostic-summary-*
          path: ${{ runner.temp }}/release-diagnostic-parts
          merge-multiple: true

      - name: Prepare an isolated release workspace
        env:
          RELEASE_EVAL_WORKSPACE: ${{ runner.temp }}/release-eval-workspace
          RELEASE_EVAL_SUITE_PATH: ${{ runner.temp }}/release-eval-suite
        run: pnpm tsx scripts/release-automation.ts prepare-workspace

      - name: Extract only this release's results
        env:
          RELEASE_EVAL_WORKSPACE: ${{ runner.temp }}/release-eval-workspace
        run: |
          for archive in "$RUNNER_TEMP"/release-score-summaries/*.tar.gz; do
            tar -C "$RELEASE_EVAL_WORKSPACE/results" -xzf "$archive"
          done

      - name: Merge failure diagnostics
        env:
          DIAGNOSTIC_PARTS_DIR: ${{ runner.temp }}/release-diagnostic-parts
          RELEASE_DIAGNOSTICS_PATH: ${{ runner.temp }}/release-diagnostics.json
        run: pnpm tsx scripts/release-diagnostics.ts merge

      - name: Export the standalone pass@1 measurement
        env:
          RELEASE_KIND: ${{ needs.prepare.outputs.release-kind }}
          NEXT_VERSION: ${{ needs.prepare.outputs.next-version }}
          NEXT_REF: ${{ needs.prepare.outputs.next-ref }}
          NEXT_SHA: ${{ needs.prepare.outputs.next-sha }}
          SOURCE_RUN_URL: ${{ needs.prepare.outputs.source-run-url }}
          EVALUATED_AT: ${{ needs.prepare.outputs.evaluated-at }}
          RELEASE_EVAL_WORKSPACE: ${{ runner.temp }}/release-eval-workspace
          RELEASE_MEASUREMENT_PATH: ${{ runner.temp }}/release-measurement.json
        run: |
          pnpm tsx scripts/release-automation.ts write-target
          cd "$RELEASE_EVAL_WORKSPACE"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/scripts/export-results.ts"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/scripts/export-results.ts" --check
          mv agent-results.json "$RELEASE_MEASUREMENT_PATH"
          mv evaluation-target.json "$RUNNER_TEMP/evaluation-target.json"

      - name: Verify publishable results were untouched
        run: |
          git status --porcelain -- results agent-results.json > "$RUNNER_TEMP/publishable-status"
          if [[ -s "$RUNNER_TEMP/publishable-status" ]]; then
            cat "$RUNNER_TEMP/publishable-status" >&2
            echo "Release automation wrote into the publishable result paths" >&2
            exit 1
          fi

      - name: Check the durable measurement for credentials
        run: |
          node scripts/assert-no-secrets.mjs \
            "$RUNNER_TEMP/release-measurement.json" \
            "$RUNNER_TEMP/evaluation-target.json" \
            "$RUNNER_TEMP/release-diagnostics.json"

      - name: Create a GitHub App token for the measurement PR
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.releaseGitHubAppClientId }}
          private-key: ${{ secrets.releaseGitHubAppPrivateKey }}
          owner: vercel
          repositories: next-evals-oss
          permission-contents: write
          permission-pull-requests: write

      - name: Get the GitHub App identity
        id: release-app-user
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${{ steps.release-app-token.outputs.app-slug }}[bot]" --jq .id)"
          echo "user-id=$user_id" >> "$GITHUB_OUTPUT"

      - name: Check out the measurement repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: vercel/next-evals-oss
          token: ${{ steps.release-app-token.outputs.token }}
          path: measurement-repository
          persist-credentials: true

      - name: Commit the standalone measurement
        id: measurement
        shell: bash
        env:
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.release-app-user.outputs.user-id }}
          NEXT_VERSION: ${{ needs.prepare.outputs.next-version }}
          RUN_ID: ${{ github.run_id }}
          MEASUREMENT_REPOSITORY: ${{ github.workspace }}/measurement-repository
        run: |
          destination="measurements/releases/$NEXT_VERSION/$RUN_ID"
          mkdir -p "$MEASUREMENT_REPOSITORY/$destination"
          cp "$RUNNER_TEMP/release-measurement.json" "$MEASUREMENT_REPOSITORY/$destination/measurement.json"
          cp "$RUNNER_TEMP/evaluation-target.json" "$MEASUREMENT_REPOSITORY/$destination/target.json"
          cp "$RUNNER_TEMP/release-diagnostics.json" "$MEASUREMENT_REPOSITORY/$destination/diagnostics.json"

          cd "$MEASUREMENT_REPOSITORY"
          branch="automation/measure-next-$NEXT_VERSION-$RUN_ID"
          git checkout -b "$branch"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_USER_ID+$APP_SLUG[bot]@users.noreply.github.com"
          git add "$destination"
          git commit -m "Record pass@1 measurement for Next.js v$NEXT_VERSION"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Open the human-reviewed measurement PR
        id: pull-request
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          NEXT_VERSION: ${{ needs.prepare.outputs.next-version }}
          NEXT_REF: ${{ needs.prepare.outputs.next-ref }}
          NEXT_SHA: ${{ needs.prepare.outputs.next-sha }}
          SOURCE_RUN_URL: ${{ needs.prepare.outputs.source-run-url }}
          RELEASE_KIND: ${{ needs.prepare.outputs.release-kind }}
          BRANCH: ${{ steps.measurement.outputs.branch }}
          DESTINATION: ${{ steps.measurement.outputs.destination }}
        working-directory: ${{ github.workspace }}/measurement-repository
        run: |
          existing="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "url=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > "$RUNNER_TEMP/measurement-pr-body.md" <<EOF
          Records the standalone pass@1 measurement for `next@$NEXT_VERSION` at `$DESTINATION`.

          - Release path: `$RELEASE_KIND`
          - Tag: `$NEXT_REF`
          - Commit: `$NEXT_SHA`
          - Release workflow: $SOURCE_RUN_URL

          This PR contains only validated aggregate scores, release provenance, and compact failure confirmations. Raw transcripts, generated applications, and command output are excluded. Merging it records the measurement without changing `results/` or `agent-results.json`, so it cannot publish to nextjs.org/evals.
          EOF
          url="$(gh pr create --draft --base main --head "$BRANCH" --title "Record Next.js v$NEXT_VERSION pass@1 measurement" --body-file "$RUNNER_TEMP/measurement-pr-body.md")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Authenticate Vercel CLI access
        uses: vercel/authenticate-cli-action@cec4e78ed4686ab05721608393617a31147f082b
        with:
          team: ${{ inputs.vercelOrgId }}

      - name: Pull the release project's short-lived credentials
        env:
          VERCEL_ORG_ID: ${{ inputs.vercelOrgId }}
          VERCEL_PROJECT_ID: ${{ inputs.vercelProjectId }}
        run: node scripts/ci-auth.mjs

      - name: Build the agent notification
        env:
          RELEASE_KIND: ${{ needs.prepare.outputs.release-kind }}
          NEXT_VERSION: ${{ needs.prepare.outputs.next-version }}
          NEXT_REF: ${{ needs.prepare.outputs.next-ref }}
          NEXT_SHA: ${{ needs.prepare.outputs.next-sha }}
          SOURCE_RUN_URL: ${{ needs.prepare.outputs.source-run-url }}
          EVALUATED_AT: ${{ needs.prepare.outputs.evaluated-at }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MEASUREMENT_URL: ${{ steps.pull-request.outputs.url }}
          AGENT_PAYLOAD_PATH: ${{ runner.temp }}/release-notification.json
          RELEASE_MEASUREMENT_PATH: ${{ runner.temp }}/release-measurement.json
          RELEASE_DIAGNOSTICS_PATH: ${{ runner.temp }}/release-diagnostics.json
        run: pnpm tsx scripts/release-automation.ts agent-notification

      - name: Ask the Eve agent to summarize in team-agent-measurements
        env:
          RELEASE_AGENT_URL: ${{ inputs.releaseAgentUrl }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H "authorization: Bearer $VERCEL_OIDC_TOKEN" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data-binary "@$RUNNER_TEMP/release-notification.json" \
            "${RELEASE_AGENT_URL%/}/release-evals"
