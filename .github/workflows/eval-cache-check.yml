name: eval cache check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pinned to a known-good next.js canary commit. To adopt new/changed evals,
      # bump this SHA in a PR that reruns them for the experiments you're
      # refreshing and lists the remaining (experiment, eval) pairs in
      # check-stale.mjs's ACCEPTED_STALE.
      - run: pnpm sync-evals 9486750ff26ed20da13b15da229da5f1746bdfa0

      # The "which staleness is acceptable" policy lives in this repo, not the
      # framework: check-stale.mjs reads `agent-eval status --json` and fails on
      # new/changed evals except those whose experiment is in its ACCEPTED_STALE list.
      - name: no unexpected stale evals
        run: node scripts/check-stale.mjs

      - name: published export is current
        run: pnpm export-results --check

  revalidate-site:
    needs: status-check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: invalidate the published evals cache
        uses: actions/github-script@v8
        with:
          script: |
            const url = 'https://nextjs.org/api/evals/revalidate';
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const token = await core.getIDToken(url);
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { authorization: `Bearer ${token}` },
                  redirect: 'error',
                  signal: AbortSignal.timeout(15_000),
                });
                if (!response.ok) throw new Error(`Revalidation returned HTTP ${response.status}`);
                if ((await response.json()).revalidated !== true) throw new Error('Revalidation was not acknowledged');
                core.info('Evals cache invalidated; stale content may be served for up to one hour.');
                return;
              } catch (error) {
                if (attempt === 3) throw error;
                core.warning(`Revalidation attempt ${attempt} failed: ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
