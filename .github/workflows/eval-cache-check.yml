name: eval cache check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  status-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pinned to a known-good next.js canary commit. To adopt new/changed evals,
      # bump this SHA in a PR that reruns them for the experiments you're
      # refreshing and lists the remaining (experiment, eval) pairs in
      # check-stale.mjs's ACCEPTED_STALE.
      # TODO: currently the tip of vercel/next.js#95630 (agent-041 judge
      # conversion); re-pin to the merged canary SHA once it lands.
      - run: pnpm sync-evals fc20f469f7ea3af0b8f156acd0d8e947dc17b183

      # The "which staleness is acceptable" policy lives in this repo, not the
      # framework: check-stale.mjs reads `agent-eval status --json` and fails on
      # new/changed evals except those whose experiment is in its ACCEPTED_STALE list.
      - name: no unexpected stale evals
        run: node scripts/check-stale.mjs
