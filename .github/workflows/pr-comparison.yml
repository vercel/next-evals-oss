name: PR eval comparison

on:
  pull_request:
    paths:
      - '.github/workflows/pr-comparison.yml'
      - 'scripts/pr-comparison*'
      - 'comparisons/**'
  workflow_dispatch:
    inputs:
      comparison:
        description: 'Manifest name in comparisons/ (without .json)'
        type: string
        default: activity-docs
      request_pr:
        description: 'Open evals OSS PR containing the comparison manifest; blank uses main'
        type: string
        default: ''
      reviewed_head:
        description: 'Exact reviewed head SHA of request_pr (required for an open PR)'
        type: string
        default: ''
      task:
        description: 'Task from the manifest, all, or leave empty for its default task'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-comparison-${{ github.event_name }}-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx --test scripts/pr-comparison.test.ts
      - run: pnpm typecheck

  compare:
    needs: check
    # The runner stays on main; a manual request can select a reviewed PR manifest.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'vercel/next-evals-oss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      checks: write
    env:
      COMPARISON_WORKSPACE: ${{ runner.temp }}/pr-comparison
      COMPARISON_NAME: ${{ inputs.comparison }}
      COMPARISON_REQUEST_FILE: ${{ runner.temp }}/pr-comparison-request.json
      COMPARISON_PR: ${{ inputs.request_pr }}
      COMPARISON_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      COMPARISON_TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the reviewed open comparison PR
        if: inputs.request_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/pr-comparison.ts request
      - name: Prepare pinned tasks and paired packages
        id: prepare
        run: node --import tsx scripts/pr-comparison.ts prepare
      - name: Pull scoped eval credentials
        env:
          REQUIRE_AI_GATEWAY_API_KEY: '1'
          VERCEL_CLI_CLIENT_ID: ${{ vars.VERCEL_CLI_CLIENT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_NEXT_UPGRADE_EVALS_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_NEXT_UPGRADE_EVALS_PROJECT_ID }}
        run: node scripts/ci-auth.mjs
      - name: Run one attempt per task and condition
        id: run
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/ci-sandbox-auth.mjs
        run: node --import tsx scripts/pr-comparison.ts run
      - name: Summarize and scan retained evidence
        id: retain
        if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        run: node --import tsx scripts/pr-comparison.ts retain
      - name: Retain reviewed-public task evidence
        if: ${{ !cancelled() && steps.retain.outputs.safe == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-comparison/artifact
          if-no-files-found: error
          retention-days: 90
      - name: Attach comparison results to the request PR
        if: ${{ !cancelled() && steps.retain.outputs.safe == 'true' && inputs.request_pr != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.env.COMPARISON_WORKSPACE;
            const report = JSON.parse(fs.readFileSync(path.join(root, 'artifact/comparison.json'), 'utf8'));
            const request = report.provenance.request;
            const complete = report.records.every(row => row.status !== 'unavailable');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.checks.create({
              ...context.repo,
              name: `PR eval comparison: ${report.provenance.name}`,
              head_sha: request.head,
              status: 'completed',
              conclusion: complete ? 'neutral' : 'failure',
              details_url: runUrl,
              output: {
                title: complete ? 'Before/after results ready' : 'Comparison incomplete',
                summary: (`[Results and traces](${runUrl})\n\n` + fs.readFileSync(path.join(root, 'artifact/README.md'), 'utf8')).slice(0, 60000),
              },
            });
      - name: Require a recorded outcome for both conditions
        if: ${{ !cancelled() && steps.retain.outputs.complete != 'true' }}
        run: |
          echo 'Comparison incomplete. Inspect the retained evidence before rerunning.' >&2
          exit 1
