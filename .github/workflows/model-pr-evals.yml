name: Evaluate a model registration PR

run-name: Measure models from ${{ inputs.prNumber && format('PR #{0}', inputs.prNumber) || 'the RoboEve queue' }}

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      prNumber:
        description: Optional RoboEve model-registration pull request number
        required: false
        type: string

concurrency:
  group: model-pr-evals
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Validate model registration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run: ${{ steps.registration.outputs.should-run }}
      pr-number: ${{ steps.registration.outputs.pr-number }}
      head-ref: ${{ steps.registration.outputs.head-ref }}
      head-sha: ${{ steps.registration.outputs.head-sha }}
      pairs: ${{ steps.registration.outputs.pairs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read eligible pull requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.prNumber }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const requested = Number(process.env.PR_NUMBER || 0);
            const pulls = requested
              ? [(await github.rest.pulls.get({ owner, repo, pull_number: requested })).data]
              : (await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'open',
                  sort: 'created',
                  direction: 'asc',
                  per_page: 100,
                })).filter((pull) =>
                  pull.user?.login === 'roboeve[bot]' &&
                  pull.head.repo?.full_name === `${owner}/${repo}` &&
                  pull.head.ref.startsWith('v/register-')
                );
            const candidates = [];
            for (const pull of pulls) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pull.number,
                per_page: 100,
              });
              candidates.push({ pullRequest: pull, files });
            }
            fs.writeFileSync(
              `${process.env.RUNNER_TEMP}/model-pr-candidates.json`,
              JSON.stringify(candidates),
            );

      - name: Select the new model pairs
        id: registration
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          MODEL_PR_CANDIDATES_JSON: ${{ runner.temp }}/model-pr-candidates.json
        run: pnpm tsx scripts/model-pr.ts discover

  evaluate:
    name: ${{ matrix.pair.base }}
    needs: prepare
    if: needs.prepare.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair: ${{ fromJSON(needs.prepare.outputs.pairs) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.head-sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync the fixed eval suite
        run: pnpm sync-evals "$(cat eval-suite-ref.txt)"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.0

      - name: Pull short-lived Vercel credentials
        env:
          REQUIRE_AI_GATEWAY_API_KEY: "1"
          VERCEL_CLI_CLIENT_ID: ${{ vars.VERCEL_CLI_CLIENT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_NEXT_UPGRADE_EVALS_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_NEXT_UPGRADE_EVALS_PROJECT_ID }}
        run: node scripts/ci-auth.mjs

      - name: Preflight the new model pair
        env:
          EXPERIMENTS_JSON: ${{ toJSON(matrix.pair.experiments) }}
        run: |
          mapfile -t experiments < <(node -e 'for (const value of JSON.parse(process.env.EXPERIMENTS_JSON)) console.log(value)')
          pnpm preflight "${experiments[@]}"

      - name: Run the complete pass@4 matrices
        env:
          EXPERIMENTS_JSON: ${{ toJSON(matrix.pair.experiments) }}
        run: |
          mapfile -t experiments < <(node -e 'for (const value of JSON.parse(process.env.EXPERIMENTS_JSON)) console.log(value)')
          for experiment in "${experiments[@]}"; do
            complete=false
            for recovery in 0 1 2 3; do
              set +e
              pnpm eval:run "$experiment"
              set -e
              if pnpm tsx scripts/model-pr.ts validate-results "$experiment"; then
                complete=true
                break
              fi
              echo "Infrastructure recovery pass $((recovery + 1))/3 for $experiment"
            done
            if [[ "$complete" != true ]]; then
              echo "The result matrix for $experiment is incomplete" >&2
              exit 1
            fi
          done

      - name: Package sanitized result output
        env:
          EXPERIMENTS_JSON: ${{ toJSON(matrix.pair.experiments) }}
          STAGE: ${{ runner.temp }}/model-results
        run: |
          mapfile -t experiments < <(node -e 'for (const value of JSON.parse(process.env.EXPERIMENTS_JSON)) console.log(value)')
          mkdir -p "$STAGE/results"
          for experiment in "${experiments[@]}"; do
            node scripts/assert-no-secrets.mjs "results/$experiment"
            cp -R "results/$experiment" "$STAGE/results/$experiment"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-results-${{ matrix.pair.base }}
          path: ${{ runner.temp }}/model-results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  update:
    name: Add results to the model PR
    needs: [prepare, evaluate]
    if: needs.prepare.outputs.should-run == 'true' && needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.head-ref }}
          token: ${{ github.token }}
          persist-credentials: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: model-results-*
          path: ${{ runner.temp }}/model-results
          merge-multiple: true

      - name: Refuse to update a changed pull request
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
        run: |
          actual="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "PR head changed while its model evals were running" >&2
            echo "expected: $EXPECTED_SHA" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi

      - name: Add the measured results
        run: cp -R "$RUNNER_TEMP/model-results/." .

      - name: Sync the fixed eval suite
        run: pnpm sync-evals "$(cat eval-suite-ref.txt)"

      - name: Export and validate the public dataset
        env:
          PAIRS_JSON: ${{ needs.prepare.outputs.pairs }}
        run: |
          pnpm export-results
          mapfile -t experiments < <(node -e 'for (const pair of JSON.parse(process.env.PAIRS_JSON)) for (const value of pair.experiments) console.log(value)')
          node scripts/assert-no-secrets.mjs agent-results.json "${experiments[@]/#/results/}"
          pnpm typecheck
          pnpm test:cost
          node scripts/check-stale.mjs
          pnpm export-results --check

      - name: Commit results to the registration PR
        env:
          HEAD_REF: ${{ needs.prepare.outputs.head-ref }}
          PAIRS_JSON: ${{ needs.prepare.outputs.pairs }}
        run: |
          mapfile -t experiments < <(node -e 'for (const pair of JSON.parse(process.env.PAIRS_JSON)) for (const value of pair.experiments) console.log(value)')
          git add agent-results.json "${experiments[@]/#/results/}"
          if git diff --cached --quiet; then
            echo "The registration PR already contains these results"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record model evaluation results"
          git push origin "HEAD:$HEAD_REF"
