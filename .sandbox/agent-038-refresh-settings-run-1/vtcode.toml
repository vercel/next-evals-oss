[automation.full_auto]
enabled = true
allowed_tools = ["*"]
max_turns = 100
[agent]
default_model = "moonshotai/Kimi-K2.6:novita"
provider = "huggingface"
api_key_env = "HF_TOKEN"
reasoning_effort = "none"
[agent.harness]
orchestration_mode = "single"
[permissions]
default_mode = "auto"
dangerously_skip_permissions = true
[output]
quiet = false