<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vtcode Agent Evals — Next.js Coding Tasks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #ededed; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat { background: #111; border: 1px solid #222; border-radius: 8px; padding: 1.25rem; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 700; }
    .stat-label { font-size: 0.85rem; color: #888; margin-top: 0.25rem; }
    .pass { color: #22c55e; }
    .fail { color: #ef4444; }
    .table-wrap { background: #111; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #181818; text-align: left; padding: 0.75rem 1rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; border-bottom: 1px solid #222; }
    td { padding: 0.65rem 1rem; border-bottom: 1px solid #1a1a1a; font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-pass { background: #052e16; color: #22c55e; }
    .badge-fail { background: #2d0a0a; color: #ef4444; }
    .eval-name { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85rem; }
    .duration { color: #888; }
    footer { margin-top: 2rem; text-align: center; color: #555; font-size: 0.8rem; }
    footer a { color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>vtcode Agent Evals</h1>
    <p class="subtitle">Next.js coding tasks from <a href="https://nextjs.org/evals" style="color:#60a5fa;">nextjs.org/evals</a></p>

    <div class="summary">
      <div class="stat">
        <div class="stat-value">8<span style="color:#555;">/24</span></div>
        <div class="stat-label">Passed</div>
      </div>
      <div class="stat">
        <div class="stat-value">33%</div>
        <div class="stat-label">Success Rate</div>
      </div>
      <div class="stat">
        <div class="stat-value">90.5s</div>
        <div class="stat-label">Avg Duration</div>
      </div>
      <div class="stat">
        <div class="stat-value">K2.6</div>
        <div class="stat-label">Model</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Eval</th>
            <th>Result</th>
            <th style="text-align:right;">Duration</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>

    <footer>
      <p>Model: moonshotai/Kimi-K2.6:novita via HuggingFace &middot; Agent: vtcode &middot; 2026-05-31</p>
      <p style="margin-top:0.4rem;"><a href="https://github.com/vercel/next-evals-oss">Source</a></p>
    </footer>
  </div>

  <script>
    const results = [
      { eval: "agent-000-app-router-migration-simple", passed: false, duration: 116.7 },
      { eval: "agent-021-avoid-fetch-in-effect", passed: true, duration: 86.7 },
      { eval: "agent-022-prefer-server-actions", passed: false, duration: 119.4 },
      { eval: "agent-023-avoid-getserversideprops", passed: true, duration: 76.7 },
      { eval: "agent-024-avoid-redundant-usestate", passed: true, duration: 73.2 },
      { eval: "agent-025-prefer-next-link", passed: true, duration: 67.5 },
      { eval: "agent-026-no-serial-await", passed: false, duration: 109.6 },
      { eval: "agent-027-prefer-next-image", passed: false, duration: 103.8 },
      { eval: "agent-028-prefer-next-font", passed: false, duration: 86.9 },
      { eval: "agent-029-use-cache-directive", passed: false, duration: 103.4 },
      { eval: "agent-030-app-router-migration-hard", passed: false, duration: 107.2 },
      { eval: "agent-031-proxy-middleware", passed: false, duration: 106.3 },
      { eval: "agent-032-use-cache-directive", passed: false, duration: 101.0 },
      { eval: "agent-033-forbidden-auth", passed: true, duration: 63.7 },
      { eval: "agent-034-async-cookies", passed: true, duration: 99.4 },
      { eval: "agent-035-connection-dynamic", passed: false, duration: 95.2 },
      { eval: "agent-036-after-response", passed: false, duration: 102.2 },
      { eval: "agent-037-updatetag-cache", passed: false, duration: 75.3 },
      { eval: "agent-038-refresh-settings", passed: true, duration: 93.5 },
      { eval: "agent-039-indirect-proxy", passed: false, duration: 69.9 },
      { eval: "agent-040-unstable-instant", passed: false, duration: 78.4 },
      { eval: "agent-041-optimize-ppr-shell", passed: false, duration: 96.4 },
      { eval: "agent-042-enable-ppr", passed: true, duration: 58.2 },
      { eval: "agent-043-view-transitions", passed: false, duration: 184.3 },
    ];

    const tbody = document.getElementById("results");
    results.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="eval-name">${r.eval}</span></td>
        <td><span class="badge ${r.passed ? 'badge-pass' : 'badge-fail'}">${r.passed ? 'PASS' : 'FAIL'}</span></td>
        <td style="text-align:right;"><span class="duration">${r.duration.toFixed(1)}s</span></td>
      `;
      tbody.appendChild(tr);
    });
  </script>
</body>
</html>
